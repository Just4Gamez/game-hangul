<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangul Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', 'Noto Sans KR', sans-serif; }
        .hangul-font { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- LOGIN SECTION -->
    <div id="section-login" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center space-y-6">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-red-600 flex items-center justify-center font-bold text-2xl text-white hangul-font">한</div>
            <div class="space-y-1">
                <h2 class="text-2xl font-black text-white">Hangul Master</h2>
                <p class="text-slate-400 text-sm">Sila log masuk menggunakan e-mel.</p>
            </div>
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">E-MEL</label>
                    <input type="email" id="login-email" placeholder="contoh@email.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">KATA LALUAN</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="handleLogin()" class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold transition text-sm">Log Masuk 🚀</button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showSection('home')">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-red-600 flex items-center justify-center font-bold text-white hangul-font">한</div>
                <div>
                    <h1 class="font-bold text-base text-white">Hangul Master</h1>
                    <p class="text-xs text-slate-400">Pengguna: <span id="display-username" class="text-amber-400 font-bold">Pelajar</span></p>
                </div>
            </div>
            <div class="flex items-center space-x-3 bg-slate-800 px-3 py-1.5 rounded-full text-sm">
                <i class="fa-solid fa-star text-amber-400"></i>
                <span id="stat-score" class="font-bold text-amber-300">0</span>
                <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400 ml-2 border-l border-slate-700 pl-2"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- HOME SECTION -->
        <section id="section-home" class="space-y-6">
            <div class="rounded-3xl bg-slate-900 border border-slate-800 p-8 text-center space-y-3">
                <h2 class="text-3xl font-black text-white">Kuasai Bahasa Korea</h2>
                <p class="text-slate-400 text-sm">Sistem Pembelajaran Hangul & Kosa Kata Asas.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div onclick="alert('Modul Asas Sedang Dibuka')" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl cursor-pointer hover:border-blue-500 transition">
                    <h3 class="font-bold text-lg text-white mb-1"><i class="fa-solid fa-graduation-cap text-blue-400 mr-2"></i> Belajar Hangul & Kosa Kata</h3>
                    <p class="text-slate-400 text-sm">Teroka nota abjad, vokal, dan frasa harian.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 py-4 text-center text-slate-500 text-xs">
        <p>Hangul Master &copy; 2026</p>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('hangul_user_email');
            if (savedEmail) {
                document.getElementById('display-username').innerText = savedEmail.split('@')[0];
                document.getElementById('section-login').classList.add('hidden');
            }
        });

        function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            if(!email || !pass) { alert('Sila masukkan e-mel dan kata laluan!'); return; }
            localStorage.setItem('hangul_user_email', email);
            document.getElementById('display-username').innerText = email.split('@')[0];
            document.getElementById('section-login').classList.add('hidden');
        }

        function logout() {
            localStorage.removeItem('hangul_user_email');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('section-login').classList.remove('hidden');
        }

        function showSection(id) {
            document.getElementById('section-home').classList.remove('hidden');
        }
    </script>
</body>
</html>
